#cloud-config
hostname: lt
manage_etc_hosts: true

package_update: true
packages:
  - curl

runcmd:
  - curl -fsSL https://tailscale.com/install.sh | sh
  - tailscale up --authkey=${tailscale_auth_key} --hostname=lt --advertise-exit-node --advertise-routes=${private_subnet_cidr} --advertise-tags=tag:oci
