# ansible/roles/tailscale/tasks/main.yml

- name: Tailscale 실행 중 확인
  command: tailscale status
  register: ts_check
  changed_when: false

- name: Tailscale IP 출력
  debug:
    msg: "{{ inventory_hostname }} Tailscale 상태: {{ ts_check.stdout_lines[0] | default('확인 중') }}"

# Exit node 설정 (AMD lt만)
- name: Exit node + subnet router 활성화
  command: >
    tailscale up
    --hostname={{ tailscale_hostname }}
    --advertise-exit-node
    --advertise-routes={{ tailscale_advertise_routes }}
    --advertise-tags=tag:oci
  when: tailscale_exit_node | bool
  notify: restart tailscale

# IP 포워딩 (exit node에 필요)
- name: IP 포워딩 활성화
  sysctl:
    name: "{{ item }}"
    value: '1'
    sysctl_set: yes
  loop:
    - net.ipv4.ip_forward
    - net.ipv6.conf.all.forwarding
  when: tailscale_exit_node | bool

# Tailscale HTTPS 인증서 발급 (ARM brla만)
- name: Tailscale DNS명 조회
  shell: tailscale status --json | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['Self']['DNSName'].rstrip('.'))"
  register: ts_dns
  changed_when: false
  when: not tailscale_exit_node | bool

- name: Tailscale 인증서 발급
  command: >
    tailscale cert
    --cert-file=/var/lib/tailscale/certs/{{ ts_dns.stdout }}.crt
    --key-file=/var/lib/tailscale/certs/{{ ts_dns.stdout }}.key
    {{ ts_dns.stdout }}
  args:
    creates: "/var/lib/tailscale/certs/{{ ts_dns.stdout }}.crt"
  become: true
  when: not tailscale_exit_node | bool

# Tailscale Serve — 포트 기반 라우팅 (brla만)
- name: Tailscale serve 초기화
  command: tailscale serve reset
  become: true
  failed_when: false
  when: not tailscale_exit_node | bool

- name: Tailscale serve — Homepage (443)
  command: tailscale serve --bg --yes http://127.0.0.1:3000
  become: true
  when: not tailscale_exit_node | bool

- name: Tailscale serve — code-server (8080)
  command: tailscale serve --bg --https 8080 --yes http://127.0.0.1:8080
  become: true
  when: not tailscale_exit_node | bool

- name: Tailscale serve — gatus (8088)
  command: tailscale serve --bg --https 8088 --yes http://127.0.0.1:8088
  become: true
  when: not tailscale_exit_node | bool

- name: Tailscale serve — beszel (8090)
  command: tailscale serve --bg --https 8090 --yes http://127.0.0.1:8090
  become: true
  when: not tailscale_exit_node | bool

- name: Tailscale serve — hermes (9119)
  command: tailscale serve --bg --https 9119 --yes http://127.0.0.1:9119
  become: true
  when: not tailscale_exit_node | bool
