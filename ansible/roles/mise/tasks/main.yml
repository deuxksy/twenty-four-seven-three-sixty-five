# ansible/roles/mise/tasks/main.yml

# mise: 런타임 버전 매니저. 공식 installer로 ubuntu 홈에 설치하여 시스템
# 패키지와 분리 — 개발 도구는 사용자 범위로 관리 (mise로 SDK 관리 원칙).

# ansible은 non-login shell이므로 mise activate가 동작하지 않음 → 모든 명령을
# 절대 경로로 호출하고, interactive shell용 활성화는 .bashrc에 별도 추가.

- name: mise 바이너리 설치 (공식 installer)
  shell: curl -fsSL https://mise.run | sh
  args:
    creates: /home/ubuntu/.local/bin/mise
  become_user: ubuntu

# activate보다 PATH export가 선행해야 함 — 그렇지 않으면 activate 실행 시점에
# mise 바이너리를 PATH에서 찾지 못해 "command not found: mise" (yazi PATH 미인식).
# activate를 파일 맨 앞(BOF)에 두고, PATH export를 activate 바로 앞에 배치하여 순서 보장.
- name: mise 셸 활성화 (.bashrc, .zshrc) — 파일 맨 앞에 추가
  lineinfile:
    path: "/home/ubuntu/{{ item.file }}"
    line: 'eval "$(mise activate {{ item.shell }})"'
    insertbefore: BOF
    create: yes
  loop:
    - { file: '.bashrc', shell: 'bash' }
    - { file: '.zshrc', shell: 'zsh' }
  become_user: ubuntu

- name: ~/.local/bin PATH 추가 (.bashrc, .zshrc) — activate보다 선행
  lineinfile:
    path: "/home/ubuntu/{{ item }}"
    line: 'export PATH="$HOME/.local/bin:$PATH"'
    insertbefore: 'mise activate'
    create: yes
  loop:
    - .bashrc
    - .zshrc
  become_user: ubuntu

# mise install/use/corepack 모두 멱동 — 이미 설치된 경우 no-op.
# ansible non-login shell이므로 mise 명령을 절대 경로로 호출.
- name: Node.js 24 LTS 설치 (mise)
  command: /home/ubuntu/.local/bin/mise install nodejs@24
  changed_when: false
  become_user: ubuntu

- name: Node.js 24 글로벌 default 설정 (mise)
  command: /home/ubuntu/.local/bin/mise use -g nodejs@24
  changed_when: false
  become_user: ubuntu

# corepack은 Node.js 24 환경에서 실행 — mise exec로 환경 명시
- name: pnpm corepack 활성화
  command: /home/ubuntu/.local/bin/mise exec nodejs@24 -- corepack enable pnpm
  changed_when: false
  become_user: ubuntu

# yazi + fzf + resvg: apt 미지공/구버전 CLI 도구 (mise aqua 백엔드, 사용자 범위)
# 우선순위: apt > mise > pnpm/uv > binary. apt로 안 되는 도구는 mise로 관리.
# code-server 터미널(interactive zsh)에서 mise activate로 PATH 인식.

# fzf: noble apt는 0.44 (yazi 0.53+ 요구) → apt 제거 후 mise 최신으로 교체
- name: apt fzf 제거 (구버전 0.44 → mise 최신으로 교체)
  apt:
    name: fzf
    state: absent

- name: yazi 설치 (mise — 터미널 파일 매니저)
  command: /home/ubuntu/.local/bin/mise use -g yazi@latest
  changed_when: false
  become_user: ubuntu

- name: fzf 설치 (mise, >= 0.53)
  command: /home/ubuntu/.local/bin/mise use -g fzf@latest
  changed_when: false
  become_user: ubuntu

# resvg: mise aqua 백엔드가 linux/arm64 미지원 (darwin/windows/amd64만 — aqua:linebender/resvg).
# cargo 백엔드는 rust toolchain(mise rust) 추가 + 빌드 시간 → SVG preview(옵션)만 제한, yazi 메인 무관으로 생략.
# 필요 시 mise install rust@latest + cargo:resvg 백엔드로 확장.
