# ansible/roles/hermes/tasks/main.yml

- name: Hermes 데이터 디렉토리 생성
  file:
    path: /data/hermes
    state: directory
    owner: ubuntu
    group: ubuntu

- name: Hermes 실제 데이터 디렉토리 생성 (컨테이너 볼륨)
  file:
    path: /data/hermes/data
    state: directory
    owner: "10000"
    group: "10000"
    mode: "0755"

- name: Ubuntu 유저 SSH 디렉토리 존재 확인
  stat:
    path: /home/ubuntu/.ssh
  register: ubuntu_ssh_dir

- name: Ubuntu 유저 SSH 디렉토리 생성 (없는 경우)
  file:
    path: /home/ubuntu/.ssh
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0700"
  when: not ubuntu_ssh_dir.stat.exists

- name: SSH config 배포 (호스트)
  template:
    src: ssh_config.j2
    dest: /home/ubuntu/.ssh/config
    owner: ubuntu
    group: ubuntu
    mode: "0644"

- name: Docker Compose 파일 생성
  template:
    src: docker-compose.yml.j2
    dest: /data/hermes/docker-compose.yml
    owner: ubuntu
    group: ubuntu

- name: Hermes 이미지 pull
  shell: docker pull nousresearch/hermes-agent:latest
  become: yes

- name: Hermes .env 존재 확인
  stat:
    path: /data/hermes/data/.env
  register: hermes_env

- name: Hermes .env 생성 (최초 1회)
  template:
    src: env.j2
    dest: /data/hermes/data/.env
    owner: "10000"
    group: "10000"
    mode: "0644"
  when: not hermes_env.stat.exists

- name: Hermes config.yaml 생성
  template:
    src: config.yaml.j2
    dest: /data/hermes/data/config.yaml
    owner: "10000"
    group: "10000"
    mode: "0644"

# --- Hermes SSH 폴더 (UID 10000, data 밖 — secret 분리)

- name: Hermes SSH 폴더 생성 (/data/hermes/ssh)
  file:
    path: /data/hermes/ssh
    state: directory
    owner: "10000"
    group: "10000"
    mode: "0700"

- name: 호스트 SSH key를 Hermes SSH 폴더로 복사
  shell: cp -a /home/ubuntu/.ssh/. /data/hermes/ssh/ && chown -R 10000:10000 /data/hermes/ssh && chmod 700 /data/hermes/ssh
  args:
    creates: /data/hermes/ssh/id_ed25519

# --- Git 백업 & 복원 (컨테이너 시작 전 데이터 준비)

- name: .git 디렉토리 소유권 변경 (hermes)
  shell: chown -R 10000:10000 /data/hermes/data/.git
  become: true

- name: Git 글로벌 설정 (root)
  git_config:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    scope: global
  loop:
    - { key: "user.name", value: "{{ git_user_name | default('Crong') }}" }
    - { key: "user.email", value: "{{ git_user_email | default('deuxksy@gmail.com') }}" }
    - { key: "safe.directory", value: "/data/hermes/data" }

- name: GitHub remote URL 확인
  shell: git remote get-url origin 2>/dev/null
  args:
    chdir: /data/hermes/data
  register: hermes_git_remote
  changed_when: false
  failed_when: false

- name: 서버 복원 — ai-brla repo에서 데이터 복원
  block:
    - name: "ai-brla 복원 디렉토리 생성"
      file:
        path: /tmp/hermes-restore
        state: directory
        mode: "0700"

    - name: "ai-brla repo clone (transient token)"
      git:
        repo: "https://x-access-token:{{ lookup('env', 'GITHUB_HERMES_TOKEN') }}@github.com/{{ hermes_backup_repo | default('deuxksy/ai-brla') }}.git"
        dest: /tmp/hermes-restore
        depth: 1
        force: yes

    - name: "ai-brla 데이터를 Hermes 볼륨에 복사"
      shell: >
        cp -a /tmp/hermes-restore/. /data/hermes/data/
      become: true

    - name: "기존 .git 유지 보장"
      shell: >
        cp -a /tmp/hermes-restore/.git /data/hermes/data/.git 2>/dev/null || true
      become: true

    - name: "복원 repo remote를 clean URL로 정리 (token 제거)"
      shell: >
        git -C /data/hermes/data remote set-url origin https://github.com/{{ hermes_backup_repo | default('deuxksy/ai-brla') }}.git
      become: true

    - name: "SQL dump 압축 해제 + SQLite import"
      shell: |
        cd /data/hermes/data
        if ls sql/*.sql.gz 1>/dev/null 2>&1; then
          gunzip -kf sql/*.sql.gz
          for sql in sql/*.sql; do
            db=$(basename "$sql" .sql)
            python3 -c "import sqlite3; c=sqlite3.connect('$db'); c.executescript(open('$sql').read()); c.close()"
          done
        fi
      become: true

    - name: "복원 디렉토리 정리"
      file:
        path: /tmp/hermes-restore
        state: absent

    - name: "데이터 소유권 복원 (hermes)"
      file:
        path: /data/hermes/data
        owner: "10000"
        group: "10000"
        recurse: yes

    - name: "복원 완료 로그"
      debug:
        msg: "✅ ai-brla repo에서 Hermes 데이터 복원 + SQL import 완료"
  when:
    - hermes_git_remote.rc != 0
    - lookup('env', 'GITHUB_HERMES_TOKEN') | default('') | length > 0

- name: Hermes .gitignore 배포
  copy:
    src: gitignore
    dest: /data/hermes/data/.gitignore
    owner: "10000"
    group: "10000"
    mode: "0644"

- name: GitHub remote 등록 (clean URL — token 없음)
  shell: >
    git remote get-url origin 2>/dev/null ||
    git remote add origin https://github.com/{{ hermes_backup_repo | default('deuxksy/ai-brla') }}.git
  args:
    chdir: /data/hermes/data
  when: lookup('env', 'GITHUB_HERMES_TOKEN') | default('') | length > 0

- name: .git 디렉토리 소유권 변경 (hermes)
  shell: chown -R 10000:10000 /data/hermes/data/.git
  become: true

- name: 초기 커밋 + push (최초 1회, transient token)
  shell: >
    git add -A &&
    git diff --cached --quiet || (git -c user.name="{{ git_user_name | default('Crong') }}" -c user.email="{{ git_user_email | default('deuxksy@gmail.com') }}" commit -m "init: Hermes backup" &&
    git push "https://x-access-token:{{ lookup('env', 'GITHUB_HERMES_TOKEN') }}@github.com/{{ hermes_backup_repo | default('deuxksy/ai-brla') }}.git" HEAD:main)
  args:
    chdir: /data/hermes/data
  when: lookup('env', 'GITHUB_HERMES_TOKEN') | default('') | length > 0

# --- 컨테이너 시작 (데이터 준비 완료 후)

- name: Hermes 컨테이너 시작
  shell: docker compose up -d
  args:
    chdir: /data/hermes
  become: yes

# --- 컨테이너 내부 도구 설치 (uv tool)

- name: shell-gpt 설치 (uv tool)
  shell: >
    docker exec hermes bash -lc "uv tool install shell-gpt &&
    uv pip install --python /opt/data/home/.local/share/uv/tools/shell-gpt/bin/python click"
  become: true
  register: sgpt_install
  changed_when: "'Installed' in sgpt_install.stdout or sgpt_install.rc == 0"

- name: shell-gpt 설정 파일 배포
  template:
    src: sgptrc.j2
    dest: /data/hermes/data/home/.config/shell_gpt/.sgptrc
    owner: "10000"
    group: "10000"
    mode: "0644"

# --- 백업 스크립트 + cron

- name: Hermes backup 스크립트 배포 (컨테이너 /opt/data/backup.sh)
  template:
    src: backup.sh.j2
    dest: /data/hermes/data/backup.sh
    owner: "10000"
    group: "10000"
    mode: "0755"

- name: 구 backup.sh 제거 (/data/hermes/backup.sh)
  file:
    path: /data/hermes/backup.sh
    state: absent

- name: Hermes backup cron 설정 (일 1회, flock + docker exec)
  cron:
    name: "hermes-backup"
    minute: "10"
    hour: "3"
    job: "flock -n /data/hermes/backup.lock docker exec hermes /opt/data/backup.sh >> /data/hermes/backup.log 2>&1"
    user: root
