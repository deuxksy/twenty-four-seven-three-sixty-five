# ansible/roles/hermes/tasks/main.yml

- name: Hermes 디렉토리 생성
  file:
    path: "{{ item }}"
    state: directory
    owner: ubuntu
    group: ubuntu
  loop:
    - /data/hermes
    - /data/hermes/data
    - /data/hermes/config

- name: Hermes Docker Compose 파일 생성
  template:
    src: docker-compose.yml.j2
    dest: /data/hermes/docker-compose.yml
    owner: ubuntu
    group: ubuntu

- name: Hermes 컨테이너 시작
  shell: docker compose up -d
  args:
    chdir: /data/hermes
  become: yes
