# ansible/roles/code-server/tasks/main.yml

# ubuntu 유저(UID 1001)를 그대로 사용하므로 별도 유저 생성 불필요
# 컨테이너 내부 UID 1001은 호스트 ubuntu와 매칭됨

- name: code-server 디렉토리 생성
  file:
    path: /data/code-server
    state: directory
    owner: ubuntu
    group: ubuntu

- name: code-server 데이터 디렉토리 생성
  file:
    path: /data/code-server/data
    state: directory
    owner: ubuntu
    group: ubuntu

- name: code-server Docker Compose 파일 생성
  template:
    src: docker-compose.yml.j2
    dest: /data/code-server/docker-compose.yml
    owner: ubuntu
    group: ubuntu

- name: code-server 컨테이너 시작
  shell: docker compose up -d
  args:
    chdir: /data/code-server
  become: yes

# /data/git 권한은 docker role의 POSIX ACL이 관리 (UID 1001/10000 rwx + default ACL 상속).
# 여기서 ubuntu:gitshare setgid로 덮어쓰면 ACL default 상속이 깨지므로 건드리지 않음.

- name: code-server .gitconfig 생성
  copy:
    dest: /data/code-server/data/.gitconfig
    owner: ubuntu
    group: ubuntu
    mode: "0644"
    content: |
      [user]
        name = Crong
        email = deuxksy@gmail.com
