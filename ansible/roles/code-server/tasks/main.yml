# ansible/roles/code-server/tasks/main.yml

# 호스트 UID 1001을 system user로 등록 (컨테이너 UID와 동일 — UID 변경 아님)
# /data/git 공유 디렉토리 접근을 위해 gitshare(GID 10001) 보조 그룹 부여
- name: code-server 호스트 유저 등록 (UID 1001, system)
  user:
    name: coder
    uid: 1001
    system: yes
    shell: /usr/sbin/nologin
    create_home: no
    groups: gitshare
    append: yes

- name: code-server 디렉토리 생성
  file:
    path: /data/code-server
    state: directory
    owner: ubuntu
    group: ubuntu

- name: code-server 데이터 디렉토리 생성
  file:
    path: /data/code-server/data
    state: directory
    owner: "1001"
    group: "1001"

- name: code-server Docker Compose 파일 생성
  template:
    src: docker-compose.yml.j2
    dest: /data/code-server/docker-compose.yml
    owner: ubuntu
    group: ubuntu

- name: code-server 컨테이너 시작
  shell: docker compose up -d
  args:
    chdir: /data/code-server
  become: yes
