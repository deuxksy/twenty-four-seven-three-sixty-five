# ansible/roles/docker/tasks/main.yml

# Docker 공식 GPG 키 추가
- name: Docker GPG 키 추가
  apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Docker APT 리포지토리 추가
  apt_repository:
    repo: "deb [arch=arm64] https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable"
    state: present
    update_cache: yes

# Docker 설치
- name: Docker Engine + Compose 플러그인 설치
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present

- name: ubuntu 유저를 docker 그룹에 추가
  user:
    name: ubuntu
    groups: docker
    append: yes

- name: Docker daemon.json 배포 (로그 로테이션)
  copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        }
      }
    owner: root
    group: root
    mode: "0644"
  notify: restart docker

- name: Docker 서비스 활성화
  service:
    name: docker
    state: started
    enabled: yes

- name: Proxy Docker 네트워크 확인
  ansible.builtin.command: docker network inspect proxy
  register: proxy_network
  changed_when: false
  failed_when: false

- name: Proxy Docker 네트워크 생성
  ansible.builtin.command: docker network create proxy
  when: proxy_network.rc != 0

# Block Volume 마운트 (/data — /home/ubuntu에 마운트하면 .ssh 덮어씌워짐)
- name: Block Volume 파일시스템 생성
  filesystem:
    fstype: ext4
    dev: /dev/oracleoci/oraclevdb

- name: /data 디렉토리 생성
  file:
    path: /data
    state: directory
    owner: ubuntu
    group: ubuntu

- name: Block Volume /data에 마운트
  mount:
    path: /data
    src: /dev/oracleoci/oraclevdb
    fstype: ext4
    state: mounted

- name: /data 소유권 설정
  file:
    path: /data
    owner: ubuntu
    group: ubuntu

# 공유 Git 디렉토리 (hermes UID:10000 + code-server UID:1001 공유)
# POSIX ACL로 두 UID 모두 rwx 부여. ACL 없으면 다른 UID는 other로 분류되어 쓰기 불가.
- name: acl 패키지 설치 (POSIX ACL)
  apt:
    name: acl
    state: present

- name: 공유 Git 디렉토리 생성 (/data/git)
  file:
    path: /data/git
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "2775"

- name: 공유 Git 디렉토리 현재 ACL 확인
  ansible.builtin.command: getfacl /data/git
  register: git_acl_current
  changed_when: false

- name: 공유 Git 디렉토리 ACL 설정 (hermes 10000 + code-server 1001 양방향 rwx)
  ansible.builtin.command: setfacl -m u:10000:rwx -m d:u:10000:rwx -m d:u:1001:rwx /data/git
  when:
    - "'user:10000:rwx' not in git_acl_current.stdout"
    - "'default:user:1001:rwx' not in git_acl_current.stdout"
