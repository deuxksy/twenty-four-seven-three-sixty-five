# ansible/playbook-hermes-only.yml
---
- name: Hermes only
  hosts: brla
  become: yes

  pre_tasks:
    - name: /data 마운트 상태 확인 (Block Volume)
      ansible.builtin.command: findmnt -n -o SOURCE --target /data
      register: data_mount_source
      changed_when: false
      failed_when: false

    - name: /data 마운트 검증 (Block Volume이 마운트되어야 함)
      ansible.builtin.assert:
        that:
          - data_mount_source.rc == 0
          - data_mount_source.stdout | length > 0
        fail_msg: "/data가 마운트되지 않음 — docker role(fstab + mount)을 먼저 실행하거나 Block Volume(/dev/oracleoci/oraclevdb)을 확인하세요"
        success_msg: "/data 마운트 확인: {{ data_mount_source.stdout }}"

    - name: acl 패키지 설치 (POSIX ACL 지원 — docker role 미실행 시 자체 보장)
      ansible.builtin.apt:
        name: acl
        state: present

    - name: 공유 Git 디렉토리 생성 fallback (/data/git, root:root 0770 — docker role 미실행 시)
      ansible.builtin.file:
        path: /data/git
        state: directory
        owner: root
        group: root
        mode: "0770"

    - name: /data/git POSIX ACL 설정 fallback (UID 1001/10000 rwx + default 상속, setfacl)
      ansible.builtin.command: >
        setfacl -R -m u:1001:rwx,u:10000:rwx -m d:u:1001:rwx,d:u:10000:rwx /data/git
      changed_when: false

  roles:
    - role: hermes
